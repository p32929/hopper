<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hopper</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></symbol>
      <symbol id="i-file-text" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></symbol>
      <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M12 10v6"/><path d="M9 13h6"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
      <symbol id="i-hard-drive" viewBox="0 0 24 24"><path d="M22 12H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M6 16h.01"/><path d="M10 16h.01"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-log-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Places">
      <div class="brand">
        <span class="brand-logo"><svg class="ic"><use href="#i-folder"/></svg></span>
        <div class="brand-text">
          <strong>Hopper</strong>
          <span id="host" class="muted">Loading…</span>
        </div>
      </div>
      <nav id="places" class="places"></nav>
      <div class="side-tools only-mobile">
        <button class="place" id="side-hidden"><svg class="ic"><use href="#i-eye"/></svg><span>Show hidden files</span></button>
        <button class="place" id="side-theme"><svg class="ic"><use href="#i-moon"/></svg><span>Dark mode</span></button>
        <button class="place" id="side-refresh"><svg class="ic"><use href="#i-refresh"/></svg><span>Refresh</span></button>
        <button class="place" id="side-logout" hidden><svg class="ic"><use href="#i-log-out"/></svg><span>Sign out</span></button>
      </div>
      <div class="sidebar-foot">
        <span class="muted" id="version"></span>
        <span class="muted" id="security-note">No password set. Use on a trusted network.</span>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="btn-menu" aria-label="Open menu"><svg class="ic"><use href="#i-menu"/></svg></button>
        <button class="icon-btn" id="btn-up" aria-label="Go to parent folder" title="Parent folder (Alt+↑)"><svg class="ic"><use href="#i-arrow-up"/></svg></button>
        <div class="crumbs" id="crumbs" data-testid="breadcrumb" title="Click to type a path (Ctrl+L)"></div>
        <button class="icon-btn only-mobile" id="btn-search" aria-label="Show filter" title="Filter"><svg class="ic"><use href="#i-search"/></svg></button>
        <label class="search">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Filter this folder" autocomplete="off" aria-label="Filter this folder">
        </label>
        <button class="icon-btn" id="btn-refresh" aria-label="Refresh" title="Refresh"><svg class="ic"><use href="#i-refresh"/></svg></button>
        <button class="icon-btn" id="btn-hidden" aria-label="Show hidden files" title="Show hidden files"><svg class="ic"><use href="#i-eye"/></svg></button>
        <button class="icon-btn" id="btn-view" aria-label="Switch view" title="Switch view"><svg class="ic"><use href="#i-grid"/></svg></button>
        <button class="icon-btn" id="btn-logout" aria-label="Sign out" title="Sign out" hidden><svg class="ic"><use href="#i-log-out"/></svg></button>
        <button class="icon-btn" id="btn-theme" aria-label="Switch theme" title="Switch theme"><svg class="ic"><use href="#i-moon"/></svg></button>
      </header>

      <div class="actionbar">
        <div class="actions-left" id="actions-default">
          <button class="btn primary" id="btn-upload"><svg class="ic"><use href="#i-upload"/></svg><span>Upload files</span></button>
          <button class="btn" id="btn-upload-folder"><svg class="ic"><use href="#i-folder"/></svg><span>Upload folder</span></button>
          <button class="btn" id="btn-newfolder"><svg class="ic"><use href="#i-folder-plus"/></svg><span>New folder</span></button>
        </div>
        <div class="actions-left" id="actions-selected" hidden>
          <span class="sel-count" id="sel-count" data-testid="selection-count"></span>
          <button class="btn primary" id="btn-download" aria-label="Download"><svg class="ic"><use href="#i-download"/></svg><span id="btn-download-label">Download</span></button>
          <button class="btn" id="btn-rename" aria-label="Rename"><svg class="ic"><use href="#i-pencil"/></svg><span>Rename</span></button>
          <button class="btn danger" id="btn-delete" aria-label="Delete"><svg class="ic"><use href="#i-trash"/></svg><span>Delete</span></button>
          <button class="btn ghost" id="btn-clear" aria-label="Clear selection"><svg class="ic"><use href="#i-x"/></svg><span>Clear</span></button>
        </div>
      </div>

      <main class="content" id="content" tabindex="-1">
        <div class="list-head" id="list-head" role="row"></div>
        <div id="listing" class="listing" data-testid="listing"></div>
        <div id="empty" class="empty" hidden></div>
      </main>

      <footer class="statusbar" id="status" data-testid="status"></footer>
    </div>
  </div>

  <button class="fab only-mobile" id="fab" aria-label="Add files or a folder" aria-haspopup="menu"><svg class="ic"><use href="#i-plus"/></svg></button>
  <div class="sheet-scrim" id="sheet-scrim" hidden></div>
  <div class="sheet" id="sheet" role="menu" aria-label="Add" hidden>
    <button class="sheet-item" id="sheet-files" role="menuitem"><span class="badge kind-image"><svg class="ic"><use href="#i-upload"/></svg></span>Upload files</button>
    <button class="sheet-item" id="sheet-folder" role="menuitem"><span class="badge kind-folder"><svg class="ic"><use href="#i-folder"/></svg></span>Upload a folder</button>
    <button class="sheet-item" id="sheet-new" role="menuitem"><span class="badge kind-document"><svg class="ic"><use href="#i-folder-plus"/></svg></span>New folder</button>
  </div>

  <div class="dropzone" id="dropzone" hidden><div><svg class="ic big"><use href="#i-upload"/></svg><strong>Drop to upload</strong><span id="drop-target" class="muted"></span></div></div>

  <section class="uploads" id="uploads" data-testid="uploads" hidden aria-label="Uploads">
    <header class="uploads-head" id="uploads-head">
      <div class="uploads-title"><strong id="uploads-title"></strong><span class="muted" id="uploads-sub"></span></div>
      <button class="icon-btn small" id="uploads-toggle" aria-label="Collapse"><svg class="ic"><use href="#i-chevron-down"/></svg></button>
      <button class="icon-btn small" id="uploads-close" aria-label="Clear finished uploads"><svg class="ic"><use href="#i-x"/></svg></button>
    </header>
    <div class="uploads-bar"><div id="uploads-bar-fill"></div></div>
    <ul class="uploads-list" id="uploads-list"></ul>
  </section>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <input type="file" id="file-input" multiple hidden>
  <input type="file" id="dir-input" webkitdirectory hidden>
</body>
</html>
